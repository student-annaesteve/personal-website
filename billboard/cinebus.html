<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CineBus billboard</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
<style>
/* Idea: from the billboard to your seat. The tiles are Barcelona's Eixample blocks, a bus route runs
   through them from a stop to the cinema, and a film strip and a ticket float on top. */
.board { --ghost: #c8102e; }
h1 { font-size: 300px; top: 60px; bottom: auto; }
.red { color: #c8102e; }
.strip { left: 700px; top: 110px; z-index: 8; transform: rotate(-12deg); }
.ticket { left: 980px; top: 640px; z-index: 8; transform: rotate(9deg); }
.stop { left: 1500px; top: 690px; width: 290px; height: 450px; z-index: 5; transform: rotate(5deg); }
.hand { left: 440px; top: 1100px; color: #7d0a1d; transform: rotate(-3deg); }
</style></head><body>
<main class="board">
  <svg class="lines" viewBox="0 0 2400 1200">
    <path stroke="#fff" stroke-width="2.5" d="M-40 980 C 240 900, 420 990, 600 900 S 860 760, 1000 820 S 1200 960, 1320 1240"/>
    <!-- the bus route: stops along the way, ending at the cinema pin -->
    <path stroke="#c8102e" stroke-width="2.5" stroke-dasharray="1 14" stroke-width="6" d="M520 -40 C 560 220, 700 400, 860 450 S 1150 470, 1260 600 S 1500 720, 1700 640 S 2100 540, 2440 600"/>
  </svg>
  <svg class="tiles" id="back" viewBox="0 0 2400 1200" style="z-index:2"></svg>
  <svg class="tiles" id="front" viewBox="0 0 2400 1200" style="z-index:5"></svg>
  <svg class="tiles" viewBox="0 0 2400 1200" style="z-index:3">
    <g fill="#c8102e" stroke="#efece4" stroke-width="5">
      <circle cx="1260" cy="600" r="11"/><circle cx="1700" cy="640" r="11"/><circle cx="860" cy="450" r="11"/>
    </g>
  </svg>

  <!-- film strip -->
  <svg class="strip shadow" width="300" height="430" viewBox="0 0 300 430">
    <rect width="300" height="430" rx="6" fill="#141816"/>
    <g fill="#efece4"><rect x="14" y="16" width="20" height="26" rx="4"/><rect x="14" y="76" width="20" height="26" rx="4"/><rect x="14" y="136" width="20" height="26" rx="4"/><rect x="14" y="196" width="20" height="26" rx="4"/><rect x="14" y="256" width="20" height="26" rx="4"/><rect x="14" y="316" width="20" height="26" rx="4"/><rect x="14" y="376" width="20" height="26" rx="4"/>
      <rect x="266" y="16" width="20" height="26" rx="4"/><rect x="266" y="76" width="20" height="26" rx="4"/><rect x="266" y="136" width="20" height="26" rx="4"/><rect x="266" y="196" width="20" height="26" rx="4"/><rect x="266" y="256" width="20" height="26" rx="4"/><rect x="266" y="316" width="20" height="26" rx="4"/><rect x="266" y="376" width="20" height="26" rx="4"/></g>
    <rect x="50" y="20" width="200" height="120" fill="#c8102e"/><rect x="50" y="155" width="200" height="120" fill="#e7d9cf"/><rect x="50" y="290" width="200" height="120" fill="#7d0a1d"/>
    <path d="M90 250 l40-55 30 35 20-20 40 40z" fill="#8f8a84"/><circle cx="210" cy="185" r="14" fill="#c8102e"/>
  </svg>

  <!-- ticket -->
  <svg class="ticket shadow" width="420" height="190" viewBox="0 0 420 190">
    <path d="M0 0h420v70a25 25 0 0 0 0 50v70H0v-70a25 25 0 0 0 0-50z" fill="#e7d9cf"/>
    <path d="M300 10v170" stroke="#7d0a1d" stroke-width="3" stroke-dasharray="8 8"/>
    <g font-family="JetBrains Mono, monospace" font-weight="600" fill="#7d0a1d">
      <text x="34" y="62" font-size="26" letter-spacing="3">CINEMA · SALA 3</text>
      <text x="34" y="128" font-size="58" fill="#c8102e">20:45</text>
      <text x="34" y="166" font-size="20" letter-spacing="2">VOSE · FILA 7</text>
      <text x="360" y="105" font-size="30" text-anchor="middle" transform="rotate(-90 360 95)">ADMIT ONE</text>
    </g>
  </svg>

  <!-- bus stop sign, drawn in pencil -->
  <svg class="stop" width="360" height="560" viewBox="0 0 360 560" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 200 L182 548"/><path d="M174 200 L176 548" stroke-width="1.5"/>
    <rect x="70" y="20" width="220" height="180" rx="18"/><rect x="74" y="24" width="214" height="174" rx="16" stroke-width="1.2"/>
    <path d="M110 70 h140 v70 h-140 z M120 140 v20 M240 140 v20 M110 100 h140" />
    <circle cx="130" cy="165" r="10"/><circle cx="230" cy="165" r="10"/>
    <path d="M100 300 l-40 40 M260 300 l40 40" stroke-width="2"/>
    <text x="180" y="340" font-family="Caveat, cursive" font-size="44" stroke="none" fill="#2b2b2b" text-anchor="middle">H12 · V15</text>
    <path d="M120 548 h120" />
  </svg>

  <p class="hand">From the billboard to your seat</p>
  <h1>Cine<br>B<span class="red">u</span><span class="ghost">s</span></h1>
  <div class="fold"></div><div class="grain"></div>
</main>
<script src="board.js"></script>
<script>
// Eixample blocks: squares with cut corners, on a straight grid
const C = ["#c8102e", "#141816", "#8f8a84", "#e7d9cf", "#7d0a1d", "#d9c7a7", "#b9b2aa"];
const block = (x, y, c) => { const s = 110, k = 30, h = s / 2;
  return `<path d="M${x - h + k} ${y - h}h${s - 2 * k}l${k} ${k}v${s - 2 * k}l${-k} ${k}h${-(s - 2 * k)}l${-k} ${-k}v${-(s - 2 * k)}z" fill="${c}"/>`; };
const [back, front] = field({ step: 118, offset: false, width: 1300, colours: C, shape: block, seed: 11 });
const extra = [[1500, 300, "#c8102e"], [2150, 820, "#141816"], [1380, 120, "#8f8a84"], [1960, 1040, "#7d0a1d"], [1240, 860, "#d9c7a7"], [1380, 520, "#e7d9cf"]]
  .map(([x, y, c]) => block(x, y, c)).join("");
document.getElementById("back").innerHTML = back + extra;
document.getElementById("front").innerHTML = front;
</script>
</body></html>
