<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mar i Muntanya billboard</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
<style>
/* Idea: the road and the simulator prototype. A road runs from the bottom left to the horizon; road
   markings fill the right side in CUPRA copper, black and asphalt grey; the simulator's screens sit on
   top as prototype frames with pencil notes, from the L3 handover to the L5 route screen. */
.board { --ghost: #c8783a; }
.cu { color: #c8783a; }
h1 { left: 80px; right: auto; top: 60px; bottom: auto; text-align: left; font-size: 210px; }
.shot { z-index: 8; border-radius: 8px; border: 6px solid #141816; background: #141816; }
.hero { right: -160px; bottom: 120px; width: 760px; z-index: 7; border-radius: 14px 0 0 14px; border-right: 0; }
.l3 { left: 1020px; top: 120px; width: 330px; transform: rotate(-6deg); }
.l4 { left: 1240px; top: 470px; width: 300px; transform: rotate(5deg); }
.lvl { z-index: 9; font: 600 30px/1 "JetBrains Mono", monospace; color: #efece4; background: #c8783a; padding: 8px 12px; border-radius: 6px; }
.note { z-index: 9; font: 500 44px/1 "Caveat", cursive; color: #2b2b2b; white-space: nowrap; }
.wheel { left: 640px; top: 640px; z-index: 6; transform: rotate(-8deg); }
.hand { left: 1440px; top: 1110px; color: #9a531f; transform: rotate(-3deg); }
</style></head><body>
<main class="board">
  <svg class="lines" viewBox="0 0 2400 1200">
    <path stroke="#fff" stroke-width="2.5" d="M-40 420 C 260 380, 420 470, 600 430 S 900 300, 1100 360 S 1400 520, 1700 470 S 2100 360, 2440 400"/>
    <path stroke="#c8783a" stroke-width="2.5" d="M900 1240 C 940 1000, 1060 860, 1200 820 S 1500 760, 1640 640 S 1900 380, 2100 300 S 2340 220, 2440 200"/>
  </svg>
  <!-- the road, from the bottom left up to the horizon, with its centre line -->
  <svg class="tiles" viewBox="0 0 2400 1200" style="z-index:3">
    <path d="M-60 1200 C 200 980, 520 860, 820 760 S 1120 640, 1180 600 L 1196 604 C 1150 650, 900 820, 700 960 S 420 1160, 380 1200 Z" fill="#2f3133"/>
    <path d="M160 1200 C 380 1010, 640 880, 900 760 S 1150 630, 1188 602" fill="none" stroke="#efece4" stroke-width="7" stroke-dasharray="46 34"/>
    <path d="M-60 1200 C 200 980, 520 860, 820 760 S 1120 640, 1180 600" fill="none" stroke="#c8783a" stroke-width="5"/>
  </svg>
  <svg class="tiles" id="back" viewBox="0 0 2400 1200" style="z-index:2"></svg>
  <svg class="tiles" id="front" viewBox="0 0 2400 1200" style="z-index:5"></svg>

  <!-- steering wheel, drawn in pencil like a prototype sketch -->
  <svg class="wheel" width="300" height="240" viewBox="0 0 300 240" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 120 C 40 40, 260 40, 260 120 C 260 170, 230 210, 200 214 L 100 214 C 70 210, 40 170, 40 120 Z"/>
    <path d="M44 124 C 46 48, 254 48, 256 124" stroke-width="1.3"/>
    <path d="M60 128 C 100 138, 120 150, 128 196 M240 128 C 200 138, 180 150, 172 196"/>
    <path d="M128 150 L150 182 L172 150 L150 160 Z" stroke="#c8783a" stroke-width="3"/>
    <path d="M20 40 l30 24 M282 40 l-30 24" stroke-width="1.5"/>
  </svg>

  <img class="hero shot shadow" src="../images/mar-i-muntanya/l5-screen-route.jpg" alt="">
  <img class="shot l3 shadow" src="../images/mar-i-muntanya/l3-handback.jpg" alt="">
  <img class="shot l4 shadow" src="../images/mar-i-muntanya/l4-ambulance.jpg" alt="">
  <span class="lvl" style="left:1000px;top:110px;transform:rotate(-6deg)">L3</span>
  <span class="lvl" style="left:1500px;top:460px;transform:rotate(5deg)">L4</span>
  <span class="lvl" style="right:560px;bottom:450px">L5</span>
  <span class="note" style="left:1370px;top:200px;transform:rotate(-4deg)">← hand back control</span>
  <span class="note" style="left:1000px;top:760px;transform:rotate(3deg)">make way →</span>
  <span class="note" style="right:140px;bottom:50px;transform:rotate(-2deg)">plan the whole trip ↑</span>
  <p class="hand">Designing trust</p>
  <h1>Mar <span class="ghost">i</span><br>M<span class="cu">u</span>ntanya</h1>
  <div class="fold"></div><div class="grain"></div>
</main>
<script src="board.js"></script>
<script>
// Road markings: slanted dashes, dense on the right edge and thinning towards the middle (the field is mirrored)
const C = ["#c8783a", "#141816", "#3a3a3a", "#9a9a9a", "#e3d3c0", "#9a531f", "#d9a77c"];
const dash = (x, y, c) => `<path d="M${x} ${y + 60}L${x + 40} ${y}H${x + 130}L${x + 90} ${y + 60}Z" fill="${c}"/>`;
const [back, front] = field({ step: 150, rowStep: 76, offset: true, width: 1150, keep: 300, colours: C, shape: dash, seed: 9 });
const mirror = (s) => `<g transform="translate(2400 0) scale(-1 1)">${s}</g>`;
const extra = dash(980, 980, "#c8783a") + dash(860, 520, "#9a9a9a") + dash(1180, 1080, "#3a3a3a") + dash(820, 160, "#d9a77c");
document.getElementById("back").innerHTML = mirror(back) + extra;
document.getElementById("front").innerHTML = mirror(front);
</script>
</body></html>
