<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mar i Muntanya billboard</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
<style>
/* Idea: the journey of the presentation. One winding road crosses the board like in the slides:
   grey where you drive, green where the car drives itself, copper at the roadworks where it hands control
   back (L3), through the city with the ambulance (L4) and out to the restaurant and the viewpoint (L5).
   The simulator prototype sits on a laptop at the bottom left; hazard stripes, halftone dots and the
   copper arrow come from the deck. Pieces in mar-i-muntanya/ are cut out of the presentation. */
.board { --ghost: #c8783a; }
.cu { color: #c8783a; }
h1 { left: 80px; right: auto; top: 60px; bottom: auto; text-align: left; font-size: 200px; }
.on { z-index: 8; transform: translate(-50%, -100%); }
.lvl { z-index: 9; font: 600 30px/1 "JetBrains Mono", monospace; color: #efece4; background: #141816; padding: 8px 12px; border-radius: 6px; transform: translate(-50%, -50%); }
.note { z-index: 9; font: 500 42px/1 "Caveat", cursive; color: #2b2b2b; white-space: nowrap; }
.laptop { left: -90px; bottom: -20px; width: 740px; z-index: 7; }
.cockpit { left: 600px; bottom: 50px; width: 330px; z-index: 8; border: 6px solid #141816; border-radius: 8px; transform: rotate(4deg); }
.stripes { right: -40px; top: 40px; width: 520px; z-index: 2; filter: brightness(0); opacity: .9; }
.stripes2 { left: 1180px; bottom: 30px; width: 300px; z-index: 2; }
.hand { right: 560px; bottom: 70px; color: #9a531f; transform: rotate(-3deg); font-size: 70px; }
</style></head><body>
<main class="board">
  <svg class="lines" viewBox="0 0 2400 1200">
    <path stroke="#fff" stroke-width="2.5" d="M-40 980 C 300 900, 520 1040, 760 960 S 1200 820, 1500 900 S 2000 1080, 2440 980"/>
    <path stroke="#c8783a" stroke-width="2.5" d="M1100 -40 C 1150 160, 1300 220, 1500 200 S 1900 120, 2100 260 S 2300 420, 2440 380"/>
  </svg>

  <!-- the deck's motifs: halftone dots and the copper arrow -->
  <svg class="tiles" viewBox="0 0 2400 1200" style="z-index:2">
    <defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#9a9a9a"/></pattern></defs>
    <rect x="1240" y="40" width="360" height="150" fill="url(#dots)" opacity=".7"/>
    <rect x="60" y="470" width="260" height="110" fill="url(#dots)" opacity=".7"/>
    <rect x="1880" y="1000" width="330" height="140" fill="url(#dots)" opacity=".6"/>
    <path d="M2400 1200 L2400 760 L2250 1200 Z M2400 760 L2010 1200 L2250 1200 Z" fill="#c8783a"/>
  </svg>
  <img class="stripes" src="mar-i-muntanya/stripes.png" alt="">

  <!-- the road -->
  <svg class="tiles" viewBox="0 0 2400 1200" style="z-index:4" fill="none" stroke-linecap="butt">
    <defs><path id="road" pathLength="1000" d="M-80 640 C 160 640, 260 560, 420 600 S 720 720, 900 560 S 1100 260, 1320 340 S 1480 700, 1720 700 S 1900 380, 2080 420 S 2300 600, 2480 520"
/></defs>
    <use href="#road" stroke="#2f3133" stroke-width="96"/>
    <use href="#road" stroke="#1f8a4c" stroke-width="96" stroke-dasharray="0 140 180 120 1000"/>
    <use href="#road" stroke="#c8783a" stroke-width="96" stroke-dasharray="0 320 60 1000"/>
    <use href="#road" stroke="#2f3133" stroke-width="96" stroke-dasharray="0 380 60 1000"/>
    <use href="#road" stroke="#1f8a4c" stroke-width="96" stroke-dasharray="0 440 560"/>
    <use href="#road" stroke="#efece4" stroke-width="6" stroke-dasharray="7 5"/>
  </svg>

  <img class="laptop shadow" src="mar-i-muntanya/laptop.png" alt="">
  <img class="cockpit shadow" src="../images/mar-i-muntanya/l4-ambulance.jpg" alt="">
  <div id="on"></div>
  <p class="hand">Designing trust</p>
  <h1>Mar <span class="ghost">i</span><br>M<span class="cu">u</span>ntanya</h1>
  <div class="fold"></div><div class="grain"></div>
</main>
<script src="board.js"></script>
<script>
// Place the pieces along the road: [fraction of the road, image or label, width, dx, dy]
const road = document.getElementById("road"), L = road.getTotalLength();
const at = (f) => road.getPointAtLength(L * f);
const put = (f, html, dx = 0, dy = 0) => { const p = at(f); return html.replace("STYLE", `left:${p.x + dx}px;top:${p.y + dy}px`); };
let h = "";
h += put(0.10, '<img class="on" style="STYLE;width:230px" src="mar-i-muntanya/car.png" alt="">', 0, 22);
h += put(0.335, '<img class="on" style="STYLE;width:110px" src="mar-i-muntanya/cone.png" alt="">', 0, 10);
h += put(0.365, '<img class="on" style="STYLE;width:84px" src="mar-i-muntanya/cone.png" alt="">', 20, 30);
h += put(0.52, '<img class="on" style="STYLE;width:270px" src="mar-i-muntanya/building.png" alt="">', -150, -40);
h += put(0.55, '<img class="on" style="STYLE;width:210px" src="mar-i-muntanya/building.png" alt="">', 160, -60);
h += put(0.60, '<img class="on" style="STYLE;width:220px" src="mar-i-muntanya/ambulance.png" alt="">', 0, 30);
h += put(0.80, '<img class="on" style="STYLE;width:230px" src="mar-i-muntanya/restaurant.png" alt="">', -40, -55);
h += put(0.93, '<img class="on" style="STYLE;width:110px" src="mar-i-muntanya/viewpoint.png" alt="">', 0, -60);
h += put(0.18, '<span class="lvl" style="STYLE">L3</span>', 0, -95);
h += put(0.56, '<span class="lvl" style="STYLE">L4</span>', -150, 60);
h += put(0.93, '<span class="lvl" style="STYLE">L5</span>', 0, 95);
h += put(0.35, '<span class="note" style="STYLE;transform:rotate(-6deg)">roadworks: hand back control</span>', -300, 150);
h += put(0.61, '<span class="note" style="STYLE;transform:rotate(4deg)">make way</span>', 120, 20);
h += put(0.80, '<span class="note" style="STYLE;transform:rotate(-3deg)">a stop for lunch</span>', 150, -230);
document.getElementById("on").outerHTML = h;
</script>
</body></html>
