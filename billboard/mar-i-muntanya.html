<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Mar i Muntanya billboard</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@700&family=Caveat:wght@500&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
<style>
/* Idea: the journey of the presentation. One winding road crosses the board like in the slides:
   grey where you drive, green where the car drives itself, copper at the roadworks where it hands control
   back (L3), through the city with the ambulance (L4) and out to the restaurant and the viewpoint (L5).
   The simulator prototype sits on a laptop at the bottom left; hazard stripes, halftone dots and the
   copper arrow come from the deck. Pieces in mar-i-muntanya/ are cut out of the presentation. */
.board { --ghost: #c8783a; }
.cu { color: #c8783a; }
h1 { left: 80px; right: auto; top: 60px; bottom: auto; text-align: left; font-size: 200px; }
.on { z-index: 8; transform: translate(-50%, -100%); }
.lvl { z-index: 9; font: 600 30px/1 "JetBrains Mono", monospace; color: #efece4; background: #141816; padding: 8px 12px; border-radius: 6px; transform: translate(-50%, -50%); }
.note { z-index: 9; font: 500 42px/1 "Caveat", cursive; color: #2b2b2b; white-space: nowrap; }
.laptop { left: -50px; bottom: 40px; width: 560px; z-index: 7; }
.stripes { right: -40px; top: 40px; width: 420px; z-index: 2; filter: brightness(0); opacity: .9; }
.hand { left: 1180px; top: 70px; color: #9a531f; transform: rotate(-3deg); font-size: 66px; }
/* screens of the simulator, hung under the road where each moment happens */
.scr { z-index: 8; transform: translateX(-50%); }
.scr img { display: block; width: 100%; border: 5px solid #141816; border-radius: 8px; }
.scr span { display: block; margin-top: 8px; font: 500 36px/1 "Caveat", cursive; color: #2b2b2b; white-space: nowrap; text-align: center; }
</style></head><body>
<main class="board">
  <svg class="lines" viewBox="0 0 2400 1200">
    <path stroke="#fff" stroke-width="2.5" d="M-40 980 C 300 900, 520 1040, 760 960 S 1200 820, 1500 900 S 2000 1080, 2440 980"/>
    <path stroke="#c8783a" stroke-width="2.5" d="M1100 -40 C 1150 160, 1300 220, 1500 200 S 1900 120, 2100 260 S 2300 420, 2440 380"/>
  </svg>

  <!-- the deck's motifs: halftone dots and the copper arrow -->
  <svg class="tiles" viewBox="0 0 2400 1200" style="z-index:2">
    <defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#9a9a9a"/></pattern></defs>
    <rect x="1700" y="170" width="300" height="120" fill="url(#dots)" opacity=".7"/>
    <rect x="60" y="470" width="260" height="110" fill="url(#dots)" opacity=".7"/>
    <rect x="560" y="1060" width="300" height="110" fill="url(#dots)" opacity=".6"/>
    <path d="M2400 1200 L2400 1000 L2180 1200 Z" fill="#c8783a"/>
  </svg>
  <img class="stripes" src="mar-i-muntanya/stripes.png" alt="">

  <!-- the road -->
  <svg class="tiles" viewBox="0 0 2400 1200" style="z-index:4" fill="none" stroke-linecap="butt">
    <defs><path id="road" pathLength="1000" d="M-80 640 C 160 640, 260 560, 420 600 S 720 720, 900 560 S 1100 260, 1320 340 S 1480 700, 1720 700 S 1900 380, 2080 420 S 2300 600, 2480 520"
/></defs>
    <use href="#road" stroke="#2f3133" stroke-width="96"/>
    <use href="#road" stroke="#1f8a4c" stroke-width="96" stroke-dasharray="0 120 100 140 1000"/>
    <use href="#road" stroke="#c8783a" stroke-width="96" stroke-dasharray="0 220 70 1000"/>
    <use href="#road" stroke="#2f3133" stroke-width="96" stroke-dasharray="0 290 70 1000"/>
    <use href="#road" stroke="#1f8a4c" stroke-width="96" stroke-dasharray="0 360 640"/>
    <use href="#road" stroke="#efece4" stroke-width="6" stroke-dasharray="7 5"/>
  </svg>

  <img class="laptop shadow" src="mar-i-muntanya/laptop.png" alt="">
  <svg class="tiles" id="leads" viewBox="0 0 2400 1200" style="z-index:6" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"></svg>
  <div id="on"></div>
  <p class="hand">Designing trust</p>
  <h1>Tr<span class="cu">u</span>sting<br><span class="ghost">a</span>utonomy</h1>
  <div class="fold"></div><div class="grain"></div>
</main>
<script src="board.js"></script>
<script>
// mar-i-muntanya.html?plain draws the board without the laptop: the project page shows that one and lets the laptop fly out of it
if (/plain/.test(location.search)) document.querySelector(".laptop").style.visibility = "hidden";
</script>
<script>
// Place the pieces along the road: [fraction of the road, image or label, width, dx, dy]
const road = document.getElementById("road"), L = road.getTotalLength();
const at = (f) => road.getPointAtLength(L * f);
const put = (f, html, dx = 0, dy = 0) => { const p = at(f); return html.replace("STYLE", `left:${p.x + dx}px;top:${p.y + dy}px`); };
let h = "", leads = "";
// Road pieces, small and where they belong: the car setting off, cones on the roadworks,
// the city around the ambulance, the restaurant at the lunch stop and the viewpoint at the end.
// each piece stands on a flat stretch, its base just over the top edge of the road (half-width 48)
const E = -28;
h += put(0.155, '<img class="on" style="STYLE;width:135px" src="mar-i-muntanya/car.png" alt="">', 0, E + 14);
h += put(0.245, '<img class="on" style="STYLE;width:42px" src="mar-i-muntanya/cone.png" alt="">', 0, E + 10);
h += put(0.27, '<img class="on" style="STYLE;width:36px" src="mar-i-muntanya/cone.png" alt="">', 0, E + 10);
h += put(0.47, '<img class="on" style="STYLE;width:115px" src="mar-i-muntanya/building.png" alt="">', 0, E);
h += put(0.69, '<img class="on" style="STYLE;width:95px" src="mar-i-muntanya/ambulance.png" alt="">', 0, E + 14);
h += put(0.85, '<img class="on" style="STYLE;width:100px" src="mar-i-muntanya/restaurant.png" alt="">', 0, E);
h += put(0.95, '<img class="on" style="STYLE;width:50px" src="mar-i-muntanya/viewpoint.png" alt="">', 0, E);
h += put(0.19, '<span class="lvl" style="STYLE">L3</span>', 0, -80);
h += put(0.40, '<span class="lvl" style="STYLE">L4</span>', 80, 0);
h += put(0.78, '<span class="lvl" style="STYLE">L5</span>', -80, 0);
// The prototype: a screen of the simulator for each moment, joined to its place on the road
const screen = (f, x, y, w, src, label) => {
  const p = at(f);
  leads += `<path d="M${p.x} ${p.y} L${x} ${y - 6}"/><circle cx="${p.x}" cy="${p.y}" r="9" fill="#141816" stroke="#efece4" stroke-width="4" stroke-dasharray="none"/>`;
  h += `<div class="scr" style="left:${x}px;top:${y}px;width:${w}px"><img class="shadow" src="../images/mar-i-muntanya/${src}" alt=""><span>${label}</span></div>`;
};
screen(0.20, 760, 780, 250, "l3-active.jpg", "system active");
screen(0.27, 1050, 760, 250, "l3-handback.jpg", "hand back control");
screen(0.655, 1400, 800, 250, "l4-ambulance.jpg", "make way");
screen(0.82, 1760, 780, 300, "l5-screen-route.jpg", "plan the trip, add a stop");
screen(0.90, 2160, 700, 230, "l5-social.jpg", "a living room");
document.getElementById("leads").innerHTML = leads;
document.getElementById("on").outerHTML = h;
</script>
</body></html>
