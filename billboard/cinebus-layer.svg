<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf6" stop-opacity=".85"/><stop offset="1" stop-color="#fffdf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".33"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <!-- projector beam: from the film strip out towards the title -->
  <path d="M1010 330 L1900 40 L1980 560 Z" fill="url(#beam)" filter="url(#soft)" opacity=".75"/>
  <g fill="#fffdf6" opacity=".55"><circle cx="1250" cy="300" r="3"/><circle cx="1390" cy="330" r="2"/><circle cx="1330" cy="230" r="2.5"/><circle cx="1520" cy="280" r="2"/><circle cx="1460" cy="380" r="3"/></g>

  <!-- clapperboard -->
  <g transform="translate(1250 300) rotate(8) scale(.9)" filter="url(#sh)">
    <rect x="0" y="62" width="250" height="170" rx="8" fill="#141816"/>
    <g transform="rotate(-16 0 58)">
      <rect x="0" y="22" width="250" height="40" rx="5" fill="#141816"/>
      <g fill="#efece4"><path d="M24 22 h30 l-22 40 h-30z"/><path d="M84 22 h30 l-22 40 h-30z"/><path d="M144 22 h30 l-22 40 h-30z"/><path d="M204 22 h30 l-22 40 h-30z"/></g>
    </g>
    <rect x="0" y="62" width="250" height="38" fill="#141816"/>
    <g fill="#efece4"><path d="M24 62 h30 l-22 38 h-30z"/><path d="M84 62 h30 l-22 38 h-30z"/><path d="M144 62 h30 l-22 38 h-30z"/><path d="M204 62 h30 l-22 38 h-30z"/></g>
    <g stroke="#efece4" stroke-width="2" opacity=".8"><path d="M14 148 h222 M14 190 h222 M125 110 v120"/></g>
    <g font-family="DejaVu Sans Mono, monospace" font-weight="700" fill="#efece4">
      <text x="20" y="138" font-size="20" letter-spacing="2">SCENE</text><text x="138" y="138" font-size="20" letter-spacing="2">TAKE</text>
      <text x="20" y="180" font-size="28" fill="#c8102e">H12</text><text x="138" y="180" font-size="28">01</text>
      <text x="20" y="220" font-size="16" letter-spacing="2" opacity=".8">CINEBUS · BCN</text>
    </g>
  </g>

  <!-- articulated TMB bus, side view, heading right to the stop -->
  <g transform="translate(560 900)" filter="url(#sh)">
    <path d="M0 150 h880" stroke="#2b2b2b" stroke-width="2" opacity=".35"/>
    <!-- rear coach -->
    <path d="M10 18 q0-18 18-18 h372 v136 h-380 q-10 0-10-10z" fill="#f7f5ef"/>
    <!-- front coach -->
    <path d="M430 0 h392 q36 0 46 34 l8 92 q0 10-10 10 h-436z" fill="#f7f5ef"/>
    <!-- bellows -->
    <rect x="398" y="6" width="34" height="128" fill="#3a3a3a"/><g stroke="#5a5a5a" stroke-width="3"><path d="M406 10 v120 M415 10 v120 M424 10 v120"/></g>
    <!-- red skirts and red front -->
    <path d="M0 106 h400 v30 h-380 q-20 0-20-10z" fill="#c8102e"/><path d="M430 106 h446 v20 q0 10-10 10 h-436z" fill="#c8102e"/>
    <path d="M820 0 q36 0 46 34 l10 92 h-60z" fill="#c8102e"/>
    <path d="M10 8 h390 M430 8 h390" stroke="#c8102e" stroke-width="5"/>
    <!-- windows -->
    <g fill="#1c2329"><rect x="28" y="22" width="360" height="56" rx="5"/><rect x="444" y="22" width="300" height="56" rx="5"/><path d="M758 22 h52 q20 0 26 20 l8 62 h-86z"/></g>
    <g stroke="#f7f5ef" stroke-width="6"><path d="M118 22 v56 M208 22 v56 M298 22 v56 M534 22 v56 M624 22 v56"/></g>
    <g fill="#ffffff" opacity=".18"><path d="M40 26 h40 l-20 48 h-40z"/><path d="M460 26 h40 l-20 48 h-40z"/></g>
    <!-- doors -->
    <g fill="#2a3138"><rect x="214" y="22" width="78" height="104" rx="3"/><rect x="540" y="22" width="78" height="104" rx="3"/><rect x="760" y="80" width="0" height="0"/></g>
    <g stroke="#f7f5ef" stroke-width="3"><path d="M253 22 v104 M579 22 v104"/></g>
    <!-- destination display -->
    <rect x="790" y="4" width="70" height="14" rx="2" fill="#141816"/><text x="825" y="15" font-family="DejaVu Sans Mono, monospace" font-size="11" font-weight="700" fill="#ffb000" text-anchor="middle">V15 CINEMA</text>
    <!-- wheels -->
    <g fill="#141816"><circle cx="90" cy="138" r="26"/><circle cx="330" cy="138" r="26"/><circle cx="500" cy="138" r="26"/><circle cx="800" cy="138" r="26"/></g>
    <g fill="#8f8a84"><circle cx="90" cy="138" r="10"/><circle cx="330" cy="138" r="10"/><circle cx="500" cy="138" r="10"/><circle cx="800" cy="138" r="10"/></g>
    <!-- headlight and TMB dot -->
    <circle cx="866" cy="112" r="6" fill="#ffe7a8"/><circle cx="700" cy="96" r="9" fill="#f7f5ef"/><circle cx="700" cy="96" r="5" fill="#c8102e"/>
  </g>
</svg>
