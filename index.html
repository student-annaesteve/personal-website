<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anna Esteve</title>
  <meta name="description" content="Anna Esteve's design portfolio: a mountain range where every summit is a project.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="labels" class="labels"></div>

  <header class="top">
    <div class="brand">
      <h1 id="name">Anna Esteve</h1>
      <p id="tagline" class="tagline"></p>
    </div>
    <button id="about-btn" class="about-btn" type="button">About &amp; contact</button>
  </header>

  <nav class="trail" aria-label="Projects">
    <p class="trail-head"><span class="blaze" aria-hidden="true"></span>Trail</p>
    <ol id="trail-list" class="trail-list"></ol>
  </nav>

  <p id="hint" class="hint">Drag to look around · Scroll to zoom · Pick a summit</p>

  <aside id="panel" class="panel" aria-live="polite" hidden>
    <button id="panel-close" class="panel-close" type="button" aria-label="Back to the range">✕</button>
    <div id="panel-body" class="panel-body"></div>
  </aside>

  <noscript><p class="noscript">This site needs JavaScript to draw the mountains.</p></noscript>

  <p class="credit">
    Mountain: <a href="https://sketchfab.com/3d-models/rugged-mountain-landscape-61f68892e8b34f8a9fbd57a5243ea142" target="_blank" rel="noopener">“Rugged mountain landscape”</a>
    by <a href="https://sketchfab.com/Tom.Jansen1" target="_blank" rel="noopener">teej_fbx</a>,
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>, simplified for the web.
  </p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="projects.js"></script>
  <script src="world.js"></script>
</body>
</html>
