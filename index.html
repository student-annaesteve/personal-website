<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Anna Esteve Gallifa</title>
  <meta name="description" content="Anna Esteve's design portfolio: a surveyed mountain where every summit is a project.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Caveat:wght@600&family=Figtree:wght@400;500;600;700&family=Tinos:ital,wght@0,400;0,700;1,700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layouts/irrigation.css">
  <link rel="stylesheet" href="layouts/mysonar.css">
  <link rel="stylesheet" href="layouts/cinebus.css">
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="labels" class="labels"></div>

  <header class="top">
    <div class="brand">
      <h1 id="name">Anna Esteve Gallifa</h1>
      <p id="tagline" class="tagline"></p>
    </div>
    <button id="about-btn" class="about-btn" type="button" aria-label="About me and contact" title="About me"><span id="about-initials" aria-hidden="true"></span></button>
  </header>

  <nav class="trail" aria-label="Projects">
    <p class="trail-head"><span>Route</span><span>Alt.</span></p>
    <ol id="trail-list" class="trail-list"></ol>
  </nav>

  <p id="hint" class="hint">Drag to look around · Scroll to zoom · Pick a summit</p>

  <aside id="panel" class="panel" aria-live="polite" hidden>
    <button id="panel-close" class="panel-close" type="button" aria-label="Back to the range">✕</button>
    <div id="panel-body" class="panel-body"></div>
  </aside>

  <noscript><p class="noscript">This site needs JavaScript to draw the mountains.</p></noscript>

  <p class="credit">
    Terrain mapped from <a href="https://sketchfab.com/3d-models/rugged-mountain-landscape-61f68892e8b34f8a9fbd57a5243ea142" target="_blank" rel="noopener">“Rugged mountain landscape”</a>
    by <a href="https://sketchfab.com/Tom.Jansen1" target="_blank" rel="noopener">teej_fbx</a>,
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>, converted to a height map.
  </p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="terrain.js"></script>
  <script src="projects.js"></script>
  <script src="layouts/irrigation.js"></script>
  <script src="layouts/mysonar.js"></script>
  <script src="layouts/cinebus.js"></script>
  <script src="world.js"></script>
</body>
</html>
